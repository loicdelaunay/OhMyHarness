name: Desktop compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Use a physical temporary directory on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          # /var and /tmp can be symlinks on macOS; sandbox fixtures reject linked ancestors.
          physical_temp="$(cd "$RUNNER_TEMP" && pwd -P)"
          printf 'TMPDIR=%s/\n' "$physical_temp" >> "$GITHUB_ENV"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: dotnet build src/OhMyHarness.App -f net10.0-desktop -c Release
      - if: runner.os == 'Windows'
        run: dotnet build src/OhMyHarness.App -f net10.0-windows10.0.19041.0 -c Release
      - run: dotnet run --project tests/OhMyHarness.Tests -c Release
      - run: dotnet run --project tests/OhMyHarness.Cli.Tests -c Release
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Publish GUI
        run: dotnet publish src/OhMyHarness.App -f net10.0-desktop -p:OhMyHarnessDesktopOnly=true -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/GUI
      - name: Publish CLI
        run: dotnet publish src/OhMyHarness.Cli -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/CLI
      - name: Package clean portable downloads
        shell: pwsh
        run: ./build/package-release.ps1 -Runtime ${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyHarness-${{ matrix.rid }}
          path: artifacts/TEMP/release-packages/GUI/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyHarness-CLI-${{ matrix.rid }}
          path: artifacts/TEMP/release-packages/CLI/*
          if-no-files-found: error
          compression-level: 0
  fedora:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - name: Install Fedora build and GUI runtime packages
        run: dnf install -y git git-lfs dotnet-sdk-10.0 nodejs npm tar gzip fontconfig libXrandr libXi mesa-libGL dbus-daemon gtk3 webkit2gtk4.1 xorg-x11-server-Xvfb
      - uses: actions/checkout@v4
        with:
          lfs: true
      - name: Verify Fedora versions
        run: |
          cat /etc/fedora-release
          dotnet --version
          node --version
      - run: dotnet build src/OhMyHarness.App -f net10.0-desktop -c Release
      - run: dotnet run --project tests/OhMyHarness.Tests -c Release
      - run: dotnet run --project tests/OhMyHarness.Cli.Tests -c Release
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - name: Publish GUI
        run: dotnet publish src/OhMyHarness.App -f net10.0-desktop -p:OhMyHarnessDesktopOnly=true -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/GUI
      - name: Publish CLI
        run: dotnet publish src/OhMyHarness.Cli -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/CLI
      - name: Smoke-test Fedora executables
        shell: bash
        run: |
          set -euo pipefail
          ./artifacts/CLI/omh --version | grep '1.13.0'
          smoke_dir="$(mktemp -d)"
          trap 'kill "$xvfb_pid" 2>/dev/null || true; rm -rf "$smoke_dir"' EXIT
          Xvfb :99 -screen 0 1280x800x24 > "$smoke_dir/xvfb.log" 2>&1 &
          xvfb_pid=$!
          sleep 2
          DISPLAY=:99 OHMYHARNESS_UI_SMOKE="$smoke_dir" OHMYHARNESS_UX_SMOKE=1 timeout 60s ./artifacts/GUI/OhMyHarness.App
          test -f "$smoke_dir/smoke-ok.txt"
          cat "$smoke_dir/smoke-ok.txt"
      - name: Package clean Fedora downloads
        run: bash ./build/package-fedora.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyHarness-linux-x64
          path: artifacts/TEMP/release-packages/GUI/*
          if-no-files-found: error
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyHarness-CLI-linux-x64
          path: artifacts/TEMP/release-packages/CLI/*
          if-no-files-found: error
          compression-level: 0
