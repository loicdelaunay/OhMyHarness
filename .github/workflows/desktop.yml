name: Desktop compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: dotnet build src/OhMyHarness.App -f net10.0-desktop -c Release
      - if: runner.os == 'Windows'
        run: dotnet build src/OhMyHarness.App -f net10.0-windows10.0.19041.0 -c Release
      - run: dotnet run --project tests/OhMyHarness.Tests -c Release
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: dotnet publish src/OhMyHarness.App -f net10.0-desktop -p:OhMyHarnessDesktopOnly=true -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o artifacts/uno/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyHarness-${{ matrix.rid }}
          path: artifacts/uno/
