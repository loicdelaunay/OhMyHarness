name: Desktop compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            pack: --win --x64 --dir
          - os: macos-15
            rid: osx-arm64
            pack: --mac --arm64 --dir
          - os: macos-15-intel
            rid: osx-x64
            pack: --mac --x64 --dir
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: dotnet build OhMyHarness.Desktop.slnx -c Release
      - run: dotnet run --project tests/OhMyHarness.Tests -c Release --no-build
      - run: npm ci
        working-directory: desktop
      - run: npm test
        working-directory: desktop
      - run: node desktop/scripts/publish-service.cjs ${{ matrix.rid }}
      - run: npx electron-builder ${{ matrix.pack }}
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: OhMyHarness-${{ matrix.rid }}
          path: desktop/dist/
