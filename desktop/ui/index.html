<!doctype html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'">
<title>OhMyHarness</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="fluent.css"><link rel="stylesheet" href="themes.css"></head>
<body>
<aside id="sidebar"><header><strong>◈ OhMyHarness</strong><small id="platform"></small></header>
  <div class="project-row"><select id="projects" aria-label="Projet"></select><button id="new-project" title="Ajouter un projet">+</button><button id="manage-project">⋯</button></div>
  <button id="new-chat" class="wide accent">＋ Nouvelle conversation</button><div id="chats"></div>
  <button id="settings-open" class="wide">⚙ Réglages</button>
</aside>
<main id="chat"><header class="chat-header"><h1 id="chat-title">OhMyHarness</h1><button id="rename-chat" title="Renommer">✎</button><button id="delete-chat" title="Supprimer">⌫</button><button id="auto-scroll" aria-pressed="true">↓ Auto</button><button id="export-chat">Exporter</button><button id="tools-toggle">▤ Outils</button></header>
  <div id="messages" aria-live="polite"></div>
  <section id="questions" aria-live="polite" hidden></section>
  <div id="status" role="status"></div>
  <footer><div class="metrics"><select id="providers" aria-label="Fournisseur"></select><select id="thinking" aria-label="Thinking"><option>auto</option><option>low</option><option>medium</option><option>high</option></select><div id="speed-area" tabindex="0" role="button" aria-label="Détail du débit" aria-expanded="false"><span id="speed">— tok/s</span><section id="speed-popover" hidden><strong id="speed-title">Débit / Throughput</strong><div id="speed-detail"></div></section></div><div id="context-area" tabindex="0" role="button" aria-label="Détail du contexte" aria-expanded="false"><span id="context">— tokens</span><progress id="context-progress" max="100" value="0"></progress><section id="context-popover" hidden><strong>Contexte / Context</strong><div id="context-detail"></div><button id="context-compact" type="button">Compacter maintenant</button></section></div></div>
    <div id="pinned-tasks" hidden></div><div id="inbox"></div><div id="assets"></div><div class="composer"><textarea id="composer" placeholder="Posez une question…" rows="3"></textarea><div class="composer-actions"><button id="plus" aria-label="Pièces jointes et skills">＋</button><span id="shortcut">Entrée ↵ · Ctrl+Entrée : nouvelle ligne</span><button id="stop" title="Arrêter">■</button><button id="send" class="accent" title="Envoyer">↑</button></div></div>
    <div id="composer-menu" class="popover" hidden></div>
  </footer>
</main>
<section id="tools" hidden><header><strong id="tools-title">Outils</strong><button id="tools-full" title="Agrandir">⛶</button><button id="tools-close" title="Fermer">×</button></header>
  <nav id="tool-tabs"><button data-tab="web" class="selected">Web</button><button data-tab="terminal">Terminal</button><button data-tab="git">Git</button><button data-tab="files">Fichiers</button></nav>
  <div id="web-tool" class="tool-content"><div class="browser-controls"><button id="web-back">←</button><input id="address" placeholder="https://…"><button id="web-go">↵</button><button id="web-file">📁</button></div><div id="browser-surface"></div></div>
  <div id="terminal-tool" class="tool-content" hidden><div class="terminal-toolbar"><nav id="terminal-tabs" aria-label="Terminaux"></nav><button id="terminal-add" aria-label="Nouveau terminal">＋</button></div><p id="shell-info" hidden></p><textarea id="command" rows="4" spellcheck="false"></textarea><button id="terminal-run">Exécuter</button><button id="terminal-stop">Arrêter</button><pre id="terminal-output"></pre></div>
  <div id="git-tool" class="tool-content" hidden><button id="git-refresh">Actualiser</button><p id="git-summary"></p><div id="git-files"></div><pre id="git-diff"></pre></div>
  <div id="files-tool" class="tool-content" hidden><div class="browser-controls"><button id="files-root">⌂</button><input id="file-path" value="."><button id="files-go">↵</button></div><div id="file-list"></div><button id="file-preview" hidden>Ouvrir dans Web</button><pre id="file-content"></pre></div>
</section>
<dialog id="settings"><header><h2>Réglages / Settings</h2><button data-close="settings">×</button></header>
  <div class="settings-layout"><nav id="setting-tabs"><button data-settings="general">Général</button><button data-settings="providers">Fournisseurs</button><button data-settings="skills">Skills</button><button data-settings="mcp">MCP</button><button data-settings="browser">Navigateur</button><button data-settings="permissions">Autorisations</button><button data-settings="templates">Templates</button></nav>
  <div id="settings-content"></div></div>
</dialog>
<dialog id="project-dialog"><form id="project-form"><h2>Projet / Project</h2><label>Nom / Name<input id="project-name" required></label><button type="button" id="project-folders">＋ Dossiers sources / Source folders</button><div id="project-sources"></div><div class="form-actions"><button type="button" id="project-delete">Supprimer / Delete</button><button type="button" data-close="project-dialog">Annuler / Cancel</button><button class="accent">Enregistrer / Save</button></div></form></dialog>
<dialog id="name-dialog"><form id="name-form"><label>Nom / Name<input id="new-name" required maxlength="120"></label><div class="form-actions"><button type="button" data-close="name-dialog">Annuler / Cancel</button><button class="accent">Enregistrer / Save</button></div></form></dialog>
<script src="app.js"></script><script src="features.js"></script><script src="appearance.js"></script></body></html>
